<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NUMBR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: a full-bleed black field; the navigation display sits in the centered square and bleeds out into it */
:root{
  --bg:#000;
  --fg:#e9ece8;
  --nd-green:#4bd54b;
  --nd-magenta:#dd54e8;
  --nd-font:"B612 Mono", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%;box-sizing:border-box;overscroll-behavior:none}
body{
  margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  padding-block:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  font-family:var(--nd-font);
}
#nd{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;cursor:crosshair;outline:none;background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<h1 class="sr">NUMBR</h1>
<canvas id="nd" tabindex="0" role="img" aria-label="Aircraft navigation display turned into a shooting game. Hold to fire, drag sideways to turn. Arrow keys and space also work, P pauses, M mutes."></canvas>

<script>
(() => {
'use strict';
const W = 1200, H = 1200;
const mc = document.getElementById('nd');
const m = mc.getContext('2d');
const sc = document.createElement('canvas'); sc.width = W; sc.height = H;
const g = sc.getContext('2d');
const small = document.createElement('canvas'); small.width = 300; small.height = 300;
const mid = document.createElement('canvas'); mid.width = 75; mid.height = 75;
const mg2 = mid.getContext('2d');
const tiny = document.createElement('canvas'); tiny.width = 19; tiny.height = 19;
const tg = tiny.getContext('2d');
const sg = small.getContext('2d');
for (const cx2 of [m, mg2, tg, sg]) { cx2.imageSmoothingEnabled = true; cx2.imageSmoothingQuality = 'high'; }

const FONT = '"B612 Mono", ui-monospace, "Courier New", monospace';
const AX = 625, AY = 880;          // aircraft symbol apex = own position
const S = 3.5;                     // screen px per NM
const CELL = 1.3;                  // radar bin size, NM
const SP = 1.5;                    // alien pixel pitch, NM
const DEG = Math.PI / 180;
const ARC = { x: 630, y: 1234, r: 929 }, ARC_A = 25.6;
const LV = [null, ['#46cf45', '#2f9f35'], ['#cbc43a', '#b5b23a'], ['#de4a2b', '#e8742e']];
const C = { w: '#eef1ec', g: '#4bd54b', m: '#dd54e8', a: '#f2a52a', c: '#62dfe8', dim: '#8d938c' };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(pointer: fine)').matches;

/* ---------- utils ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd = Math.random;
function hash(i,j,s){let n=(Math.imul(i,374761393)+Math.imul(j,668265263)+Math.imul(s,1442695041))|0;n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return (n>>>0)/4294967296;}
function vnoise(x,y,s){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=hash(i,j,s),b=hash(i+1,j,s),c=hash(i,j+1,s),d=hash(i+1,j+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,s){return vnoise(x,y,s)*0.6+vnoise(x*2.3,y*2.3,s+7)*0.3+vnoise(x*5.1,y*5.1,s+13)*0.1;}
const G = (t,m0,w) => Math.exp(-(((t-m0)/w)**2));
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const pad = (n,l) => String(n).padStart(l,'0');
function lerpTable(tab,t){for(let i=1;i<tab.length;i++){if(t<=tab[i][0]){const a=tab[i-1],b=tab[i];return a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]);}}return tab[tab.length-1][1];}
function catmull(p,n){const out=[];for(let i=0;i<p.length-1;i++){const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)];for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;const f=q=>0.5*((2*p1[q])+(-p0[q]+p2[q])*t+(2*p0[q]-5*p1[q]+4*p2[q]-p3[q])*t2+(-p0[q]+3*p1[q]-3*p2[q]+p3[q])*t3);out.push([f(0),f(1)]);}}out.push(p[p.length-1]);return out;}
function compact(arr){let j=0;for(let i=0;i<arr.length;i++){if(!arr[i].dead)arr[j++]=arr[i];}arr.length=j;}

let SH = Math.sin(36*DEG), CH = Math.cos(36*DEG), WX = 0, WY = 0;
let RR = 0, FF = 0;
let st;
let best = 0, muted = false;
try { best = +localStorage.getItem('numbr.best') || 0; muted = localStorage.getItem('numbr.mute') === '1'; } catch (e) {}

function w2s(x,y){const dx=x-st.ax,dy=y-st.ay;const f=dx*SH+dy*CH,r=dx*CH-dy*SH;return [AX+r*S,AY-f*S,f,r];}
function s2w(sx,sy){const r=(sx-AX)/S,f=(AY-sy)/S;return [st.ax+r*CH+f*SH, st.ay-r*SH+f*CH];}
function rf2w(r,f){return [st.ax+r*CH+f*SH, st.ay-r*SH+f*CH];}
function relv(x,y){const dx=x-st.ax,dy=y-st.ay;FF=dx*SH+dy*CH;RR=dx*CH-dy*SH;}
function inTri(r,f,p){return f<1.5+p && f>-16-p && Math.abs(r)<Math.max(0,-f)*0.57+1.0+p;}

/* ---------- state ---------- */
function newState(){
  return {ver:2,mode:'title',paused:false,h:36,ht:33,hv:0,ax:0,ay:0,spd:4,t:0,time:0,clock:4*60+49.2,
    cells:[],bullets:[],parts:[],rings:[],aliens:[],ashots:[],pickups:[],pending:[],
    route:[],fixes:[],ai:1,score:0,lives:3,inv:0,heat:0,hot:0,spread:0,hold:0,combo:0,comboT:0,mult:1,
    wave:0,queue:[],waveT:0,banner:0,bannerKind:'',clearing:false,waveHit:false,bonus:0,
    glitch:0,glitchAmp:1,vhs:null,shake:0,freeze:0,flag:'',flagCol:'#f2a52a',flagT:0,deadRows:[],overT:0,
    spawnCD:9,strayCD:0,fireCD:0,firing:false,hintA:1,wdir:252,wspd:61,latN:35,lonW:58,sweep:0,beat:0,K:1,newBest:false,diff:0};
}

function mkCell(x,y,l,stray){
  return {x,y,vx:0,vy:0,l,s:rnd()<0.5?0:1,sz:stray?2.3+rnd()*1.3:3.4+rnd()*1.9+(l===3?0.5:0),st:stray?1:0,dead:false};
}

function addBand(pts,wFn,heatFn,o){
  const P=catmull(pts,8);const L=[0];
  for(let i=1;i<P.length;i++)L[i]=L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);
  const total=L[L.length-1]||1;const seed=o.seed|0,dens=o.density||0.78,bias=o.bias||0;
  const fs=Math.sin(o.frameH*DEG),fc=Math.cos(o.frameH*DEG);
  const map=new Map();let seg=0;
  for(let d=0;d<=total;d+=0.6){
    while(seg<P.length-2&&L[seg+1]<d)seg++;
    const a=P[seg],b=P[seg+1];const sl=(L[seg+1]-L[seg])||1;const tt=(d-L[seg])/sl;
    const px=a[0]+(b[0]-a[0])*tt,py=a[1]+(b[1]-a[1])*tt;
    const tx=(b[0]-a[0])/sl,ty=(b[1]-a[1])/sl;const nx=-ty,ny=tx;
    const t=d/total;const w=Math.max(1.2,wFn(t));const heat=heatFn(t);
    for(let off=-w*1.25;off<=w*1.25;off+=0.8){
      const x=px+nx*off,y=py+ny*off;
      const gi=Math.round(x/CELL),gj=Math.round(y/CELL);const key=gi*100003+gj;
      const edge=1-Math.abs(off)/w;
      const u=x*fc-y*fs,v=x*fs+y*fc;
      const n=fbm(x*0.16,y*0.16,seed);
      const streak=vnoise(u*0.12,v*0.75,seed+5);
      const val=edge*0.85+(n-0.5)*0.9+(streak-0.5)*0.55;
      if(val<0.1)continue;
      if(rnd()>dens*(0.5+0.5*Math.min(1,val*1.6)))continue;
      const hv=heat*Math.max(0,edge)*1.15+(n-0.5)*0.45+bias;
      const l=hv>0.72?3:hv>0.44?2:1;
      const ex=map.get(key);if(!ex||ex.l<l)map.set(key,{gi,gj,l});
    }
  }
  for(const c of map.values())st.cells.push(mkCell((c.gi+(rnd()-0.5)*0.7)*CELL,(c.gj+(rnd()-0.5)*0.7)*CELL,c.l,false));
}

function initWorld(){
  rnd = mulberry(20261022);
  SH=Math.sin(36*DEG);CH=Math.cos(36*DEG);
  const P=[[268,858],[305,800],[350,732],[402,668],[456,605],[505,556],[533,505],[549,450],[563,396],[590,346],[621,312]].map(p=>s2w(p[0],p[1]));
  const WT=[[0,26],[0.15,42],[0.42,58],[0.7,56],[0.88,40],[1,20]];
  addBand(P,t=>lerpTable(WT,t)/S,t=>0.1+0.85*G(t,0.05,0.06)+0.7*G(t,0.2,0.06)+0.66*G(t,0.42,0.07)+0.45*G(t,0.55,0.04)+0.25*G(t,0.72,0.05),{seed:1337,frameH:36,density:0.6});
  const Lb=[[262,822],[270,778],[284,742]].map(p=>s2w(p[0],p[1]));
  addBand(Lb,()=>13/S,t=>0.25+0.6*G(t,0.35,0.25),{seed:77,frameH:36,density:0.75});
  let n=0,guard=0;
  while(n<80&&guard++<2000){
    const sx=rnd()<0.62?660+rnd()*360:180+rnd()*460, sy=320+rnd()*560;
    if(Math.hypot(sx-ARC.x,sy-ARC.y)>ARC.r-10)continue;
    const [x,y]=s2w(sx,sy);st.cells.push(mkCell(x,y,1,true));n++;
  }
  const r0=s2w(602,1090),r1=s2w(642,730),r2=s2w(800,552),r3=s2w(905,250);
  st.route=[{x:r0[0],y:r0[1],name:'',eta:0},{x:r1[0],y:r1[1],name:'NUMBR',eta:4*60+49},{x:r2[0],y:r2[1],name:'3360N',eta:4*60+56},{x:r3[0],y:r3[1],name:'3459N',eta:4*60+56+Math.hypot(r3[0]-r2[0],r3[1]-r2[1])/4*0.25}];
  const f1=s2w(632,752);st.fixes=[{x:f1[0],y:f1[1],name:'N32W061'}];
  st.K=44.7/Math.hypot(r1[0],r1[1]);
  rnd = Math.random;
}

const FIXES=['KANUR','ELSOX','DOVEY','TAFFY','JOBOC','BOBTU','LUNNI','ZILLO','TUDEP','MUSAK','GISTI','BEXAL','SAVIK','OMOKO','RAFIN'];
function nextName(){
  if(rnd()<0.5&&st.lonW>20){const n=`${st.latN}${pad(st.lonW,2)}N`;st.latN++;st.lonW-=1+(rnd()*2|0);return n;}
  return FIXES[(rnd()*FIXES.length)|0];
}
function addWp(){
  const R=st.route,a=R[R.length-2],b=R[R.length-1];
  const ang=Math.atan2(b.x-a.x,b.y-a.y)+(rnd()-0.5)*0.8;const len=70+rnd()*50;
  const p={x:b.x+Math.sin(ang)*len,y:b.y+Math.cos(ang)*len,name:nextName(),eta:0};
  let dist=Math.hypot(R[st.ai].x-st.ax,R[st.ai].y-st.ay);
  for(let i=st.ai+1;i<R.length;i++)dist+=Math.hypot(R[i].x-R[i-1].x,R[i].y-R[i-1].y);
  dist+=len;p.eta=st.clock+dist/st.spd*0.25;R.push(p);
}

function spawnStorm(){
  const seed=(rnd()*1e6)|0,bias=0.12*st.diff;
  if(rnd()<0.62){
    const L=70+rnd()*110,a=(rnd()-0.5)*1.4,bend=(rnd()-0.5)*0.9;
    const fC=185+Math.abs(Math.sin(a))*L*0.5+rnd()*25,rC=(rnd()-0.5)*220;
    const pts=[];
    for(let k=0;k<=6;k++){const u=k/6-0.5;const wob=(vnoise(k*0.7,seed%97,seed)-0.5)*14;const off=bend*(u*u-0.25)*L+wob;
      pts.push(rf2w(rC+Math.cos(a)*u*L-Math.sin(a)*off, fC+Math.sin(a)*u*L+Math.cos(a)*off));}
    const w0=5+rnd()*7;const nb=1+(rnd()*3|0);const bumps=[];for(let i=0;i<nb;i++)bumps.push([0.15+rnd()*0.7,0.05+rnd()*0.08,0.5+rnd()*0.45]);
    addBand(pts,t=>w0*(0.45+0.75*Math.pow(Math.sin(Math.PI*t),0.6)),t=>0.12+bumps.reduce((s,b)=>s+b[2]*G(t,b[0],b[1]),0),{seed,frameH:st.h,bias,density:0.7});
  } else {
    const n=2+(rnd()*4|0),rC=(rnd()-0.5)*240,fC=195+rnd()*20;
    for(let i=0;i<n;i++){const R=3+rnd()*6,hk=0.45+rnd()*0.55;const [x,y]=rf2w(rC+(rnd()-0.5)*70,fC+(rnd()-0.5)*40);
      addBand([[x,y-R*0.3],[x+0.01,y+R*0.3]],t=>R*(0.5+0.5*Math.sin(Math.PI*t)),t=>hk*Math.sin(Math.PI*t)+0.1,{seed:seed+i,frameH:st.h,bias,density:0.8});}
  }
}
function spawnStray(){const [x,y]=rf2w((rnd()-0.5)*520,172+rnd()*50);st.cells.push(mkCell(x,y,1,true));}

/* ---------- aliens: procedural mirrored pixel creatures ---------- */
const TYPES={
  drone:   {w:5, h:5, cores:1, pts:100},
  weaver:  {w:7, h:5, cores:1, pts:150},
  gunner:  {w:7, h:7, cores:1, pts:250},
  splitter:{w:9, h:7, cores:1, pts:200},
  mother:  {w:15,h:9, cores:3, pts:2500}
};
const TYPE_IX={drone:1,weaver:2,gunner:3,splitter:4,mother:5};
function genSprite(w,h,seed,nc){
  for(let tries=0;tries<12;tries++){
    const R=mulberry(seed+tries*7919);const half=(w+1)>>1;const cx=half-1,cy=h>>1;
    const grid=[];
    for(let j=0;j<h;j++){grid.push(new Array(w).fill(false));
      for(let i=0;i<half;i++){const p=0.42+0.3*(i/(half-1||1))-(j===0?0.12:0);const on=R()<p;grid[j][i]=on;grid[j][w-1-i]=on;}}
    const cores=[[cx,cy]];
    if(nc===3){cores.push([cx-4,cy],[cx+4,cy]);for(let i=cx-4;i<=cx+4;i++)grid[cy][i]=true;}
    for(const [i,j] of cores){grid[j][i]=true;if(j>0)grid[j-1][i]=true;if(j<h-1)grid[j+1][i]=true;}
    const keep=grid.map(r=>r.map(()=>false));const stack=[[cx,cy]];
    while(stack.length){const [i,j]=stack.pop();if(i<0||j<0||i>=w||j>=h||keep[j][i]||!grid[j][i])continue;keep[j][i]=true;stack.push([i+1,j],[i-1,j],[i,j+1],[i,j-1]);}
    const legB=new Array(w).fill(false);for(let i=0;i<half;i++){const on=R()<0.5;legB[i]=on;legB[w-1-i]=on;}
    const cells=[];
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){
      const isCore=cores.some(c=>c[0]===i&&c[1]===j);
      if(j===h-1){const a=keep[j][i],b=legB[i]&&keep[h-2][i];
        if(a&&b)cells.push({i,j,core:false,fr:0});else if(a)cells.push({i,j,core:false,fr:1});else if(b)cells.push({i,j,core:false,fr:2});}
      else if(keep[j][i])cells.push({i,j,core:isCore,fr:0});
    }
    if(cells.length>=w*h*0.42)return cells;
  }
  const cells=[];for(let j=0;j<h;j++)for(let i=0;i<w;i++)cells.push({i,j,core:i===(w>>1)&&j===(h>>1),fr:0});return cells;
}
const SPR={};
function sprite(type){const key=type+'_'+st.wave;if(!SPR[key]){const T=TYPES[type];SPR[key]=genSprite(T.w,T.h,st.wave*977+TYPE_IX[type]*131+5,T.cores);}return SPR[key];}

function spawnAlien(e){
  const sp=sprite(e.type);
  const a={type:e.type,r:e.r,f:e.f!=null?e.f:182+(e.fo||0),vr:e.vr||0,vf:0,t:0,ph:rnd()*6.28,
    cells:sp.map(c=>({i:c.i,j:c.j,core:c.core,fr:c.fr,alive:true})),flash:0,tele:false,
    fireT:1.6+rnd()*2,tf:e.type==='gunner'?122+rnd()*28:e.type==='mother'?138:128+rnd()*30,spawnT:3.5,
    alt:(1+(rnd()*9|0))*(rnd()<0.5?-1:1),dead:false};
  a.total=a.cells.length;a.n=a.total;a.cores=a.cells.filter(c=>c.core).length;
  st.pending.push(a);
}

function buildWave(n){
  const q=[];let t=2.4;
  if(n%5===0){
    q.push({t,type:'mother',r:0});
    const nd=3+n/5;
    for(let i=0;i<nd;i++)q.push({t:t+4+i*2.6,type:'drone',r:(rnd()-0.5)*180});
  } else {
    let nd=Math.min(14,3+Math.round(1.5*n));
    const nw=n>=3?Math.min(4,1+((n-3)>>1)):0, ng=n>=4?Math.min(3,(n-2)>>1):0, ns=n>=6?Math.min(3,((n-3)/3)|0):0;
    const gap=Math.max(1.3,2.9-0.1*n);
    const items=[];
    while(nd>0){const k=Math.min(nd,2+(rnd()*3|0));items.push({type:'dgroup',k});nd-=k;}
    for(let i=0;i<nw;i++)items.push({type:'weaver'});
    for(let i=0;i<ng;i++)items.push({type:'gunner'});
    for(let i=0;i<ns;i++)items.push({type:'splitter'});
    const first=items.shift();
    for(let i=items.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[items[i],items[j]]=[items[j],items[i]];}
    items.unshift(first);
    for(const it of items){
      if(it.type==='dgroup'){const rc=(rnd()-0.5)*160;for(let k=0;k<it.k;k++){const o=k-(it.k-1)/2;q.push({t:t+k*0.16,type:'drone',r:rc+o*9,fo:Math.abs(o)*6});}t+=gap*1.3;}
      else{q.push({t,type:it.type,r:(rnd()-0.5)*180});t+=gap;}
    }
  }
  q.sort((a,b)=>a.t-b.t);
  return q;
}

/* ---------- audio: worn tape, warbling pad, glitch grains ---------- */
const A={ctx:null,padBase:900};
const mtof=x=>440*Math.pow(2,(x-69)/12);
const CHORDS=[[50,57,61,64,66],[47,54,57,61,62],[43,50,54,59,61],[45,52,57,59,62]];
const POOL=[74,76,78,81,83,86,88,90];
let chordIx=0,mIx=3;
function satCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(k*x)/Math.tanh(k);}return c;}
function audioInit(){
  if(A.ctx){if(A.ctx.state==='suspended'&&!st.paused)A.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  let c;try{c=new AC();}catch(e){return;}
  A.ctx=c;
  const master=c.createGain();master.gain.value=muted?0:0.85;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
  master.connect(comp);comp.connect(c.destination);
  const sat=c.createWaveShaper();sat.curve=satCurve(2.2);sat.oversample='2x';
  const tone=c.createBiquadFilter();tone.type='lowpass';tone.frequency.value=5200;
  const bus=c.createGain();bus.connect(sat);sat.connect(tone);tone.connect(master);
  A.bus=bus;A.master=master;
  const pitch=c.createConstantSource();pitch.offset.value=0;pitch.start();A.pitch=pitch;
  const wow=c.createOscillator();wow.frequency.value=0.31;const wg=c.createGain();wg.gain.value=16;wow.connect(wg);wg.connect(pitch.offset);wow.start();

/* ---------- gameplay ---------- */
function fire(){
  const dirs=st.spread>0?[-7,0,7]:[0];
  for(const d of dirs){const hh=(st.h+d)*DEG;const s=Math.sin(hh),c=Math.cos(hh);
    st.bullets.push({x:st.ax+s*0.5,y:st.ay+c*0.5,vx:SH*st.spd+WX+s*52,vy:CH*st.spd+WY+c*52,life:3.6,dead:false});}
  st.heat+=st.spread>0?0.06:0.048;
  if(st.heat>=1){st.heat=1;st.hot=1.2;flag('GUN HOT',C.a,1.2);sfx.hot();}
  sfx.fire();
}
function flag(text,col,t){st.flag=text;st.flagCol=col;st.flagT=t;}
function debris(x,y,vx,vy,cols,n,spd,life){
  for(let i=0;i<n;i++){
    if(st.parts.length>1800)st.parts.shift();
    const a=rnd()*6.2832,sp=spd*(0.3+rnd());const l=life*(0.5+rnd()*0.8);
    st.parts.push({x,y,vx:vx+Math.cos(a)*sp,vy:vy+Math.sin(a)*sp,life:l,max:l,col:cols[rnd()<0.5?0:1],sz:2+rnd()*2.5,dead:false});
  }
}
function pushWeather(x,y,R,k){
  for(const c of st.cells){if(c.dead)continue;const dx=c.x-x,dy=c.y-y,d2=dx*dx+dy*dy;
    if(d2<R*R&&d2>0.01){const d=Math.sqrt(d2);const f=(1-d/R)*k;c.vx+=dx/d*f;c.vy+=dy/d*f;}}
}
function explode(x,y){
  let killed=0,deg=0,strays=0;
  for(const c of st.cells){
    if(c.dead)continue;const dx=c.x-x,dy=c.y-y,d2=dx*dx+dy*dy;
    if(d2<6.25){
      if(c.st){c.dead=true;strays++;st.score+=5;debris(c.x,c.y,WX+c.vx,WY+c.vy,['#5ee05a','#ffffff'],5,10,1.2);}
      else{const cols=LV[c.l];c.l--;st.score+=1;
        if(c.l<=0){c.dead=true;killed++;debris(c.x,c.y,WX+c.vx,WY+c.vy,cols,2,8,1.3);}
        else{deg++;debris(c.x,c.y,WX+c.vx,WY+c.vy,cols,1,6,1);}}
    } else if(d2<64){const d=Math.sqrt(d2)||1;const k=(1-d/8)*11;c.vx+=dx/d*k;c.vy+=dy/d*k;}
  }
  st.rings.push({x,y,t:0,big:false});
  debris(x,y,WX,WY,['#ffffff',C.m],6,18,0.3);
  if(strays)sfx.stray();
  if(deg)sfx.thud();
  if(killed||deg)sfx.pixel(killed+deg);
}
function cellRF(a,c){const T=TYPES[a.type];return [a.r+(c.i-(T.w-1)/2)*SP, a.f-(c.j-(T.h-1)/2)*SP];}
function relVecW(vr,vf){return [vr*CH+vf*SH,-vr*SH+vf*CH];}

function chip(a,c){
  c.alive=false;a.n--;a.f+=0.5;a.flash=0.06;
  const [cr,cf]=cellRF(a,c);const [x,y]=rf2w(cr,cf);
  const avx=SH*st.spd+WX,avy=CH*st.spd+WY;const [ox,oy]=relVecW(0,9);
  debris(x,y,avx+ox,avy+oy,c.core?[C.m,'#ffffff']:alienCol(a),c.core?6:3,12,1.1);
  st.score+=5;sfx.chip();
  if(c.core)a.cores--;

}
function killAlien(a,quiet){
  if(a.dead)return;a.dead=true;
  const avx=SH*st.spd+WX,avy=CH*st.spd+WY;const cols=alienCol(a);
  for(const c of a.cells){if(!c.alive)continue;const [cr,cf]=cellRF(a,c);const [x,y]=rf2w(cr,cf);
    const dr=cr-a.r,df=cf-a.f;const L=Math.hypot(dr,df)||1;const sp=10+rnd()*16;const [vx,vy]=relVecW(dr/L*sp,df/L*sp);
    if(st.parts.length>1800)st.parts.shift();
    const l=0.9+rnd()*1.1;st.parts.push({x,y,vx:avx+vx,vy:avy+vy,life:l,max:l,col:c.core?C.m:cols[rnd()<0.6?0:1],sz:4,dead:false});}
  const [wx,wy]=rf2w(a.r,a.f);
  st.rings.push({x:wx,y:wy,t:0,big:a.type==='mother'});
  pushWeather(wx,wy,a.type==='mother'?30:12,a.type==='mother'?25:12);
  if(quiet)return;
  st.combo++;st.comboT=3.4;st.mult=Math.min(8,1+Math.floor(st.combo/4));
  st.score+=TYPES[a.type].pts*st.mult;
  st.freeze=a.type==='mother'?0.5:0.06;
  st.shake=Math.max(st.shake,a.type==='mother'?1.2:0.25);
  sfx.kill(st.mult,a.type);
  if(a.type==='splitter'){for(const s of [-1,1])spawnAlien({type:'drone',r:a.r+s*4,f:a.f,vr:s*18});}
  if(a.type==='mother')st.pickups.push({r:a.r,f:a.f,vr:0,vf:-7,kind:'+1',t:0,dead:false});
  else if(rnd()<0.18){const k=rnd();st.pickups.push({r:a.r,f:a.f,vr:0,vf:-6,kind:k<0.45?'SPRD':k<0.78?'HOLD':'+1',t:0,dead:false});}
}
function collect(p){
  p.dead=true;
  if(p.kind==='SPRD'){st.spread=12;flag('SPRD',C.c,2);}
  else if(p.kind==='HOLD'){st.hold=6;flag('HOLD',C.c,2);sfx.holdOn();}
  else {st.lives=Math.min(3,st.lives+1);st.deadRows.shift();flag('+ACFT',C.c,2);}
  st.score+=50;sfx.pickup();
}
function hitPlayer(){
  if(st.inv>0||st.mode!=='play')return;
  st.lives--;st.inv=3.2;st.waveHit=true;st.combo=0;st.mult=1;
  st.shake=0.6;
  flag('TRAFFIC',C.a,2.4);
  for(const c of st.cells){if(c.dead)continue;if(Math.hypot(c.x-st.ax,c.y-st.ay)<14){c.dead=true;debris(c.x,c.y,WX,WY,LV[c.st?1:c.l],1,12,1);}}
  for(const s of st.ashots)s.dead=true;

const keys={l:false,r:false,f:false};
function update(dt){
  st.time+=dt;
  if(st.glitch>0)st.glitch-=dt;
  if(st.vhs){const v=st.vhs;v.t+=dt;
    if(v.mode==='rew'){if(v.t>=v.dur){st.vhs={mode:'play',t:0,dur:1.2};sfx.play();}else return;}
    else if(v.mode==='play'&&v.t>=v.dur)st.vhs=null;
    else if(v.mode==='stop'&&v.t>=v.dur)st.vhs={mode:'stopped',t:0,dur:0};}
  st.flagT=Math.max(0,st.flagT-dt);
  st.shake=Math.max(0,st.shake-dt*3);
  if(st.freeze>0){st.freeze-=dt;dt*=0.12;}
  updateParts(dt);
  for(const r of st.rings){r.t+=dt;if(r.t>(r.big?0.8:0.35))r.dead=true;}compact(st.rings);
  if(st.mode==='title')return;
  if(st.mode==='over'){st.overT+=dt;return;}

  st.t+=dt;
  if(st.hintA>0&&st.t>4)st.hintA=Math.max(0,st.hintA-dt*0.4);
  st.inv=Math.max(0,st.inv-dt);st.spread=Math.max(0,st.spread-dt);st.hold=Math.max(0,st.hold-dt);
  st.comboT-=dt;if(st.comboT<=0&&st.combo){st.combo=0;st.mult=1;}
  if(st.hot>0){st.hot-=dt;if(st.hot<=0)st.heat=0.35;}else st.heat=Math.max(0,st.heat-0.6*dt);

  // heading
  if(keys.l)st.ht-=80*dt;if(keys.r)st.ht+=80*dt;
  st.ht=clamp(st.ht,st.h-60,st.h+60);
  const want=clamp((st.ht-st.h)*3.2,-58,58);st.hv+=(want-st.hv)*Math.min(1,dt*5);
  const dh=st.hv*dt;st.h+=dh;rotateRel(dh*DEG);
  st.wdir=252+18*Math.sin(st.t/45);
  setWind();
  SH=Math.sin(st.h*DEG);CH=Math.cos(st.h*DEG);
  st.spd=4+1.6*st.diff;
  st.ax+=(SH*st.spd+WX)*dt;st.ay+=(CH*st.spd+WY)*dt;

    const dx=c.x-st.ax,dy=c.y-st.ay;const f=dx*SH+dy*CH,r=dx*CH-dy*SH;
    if(c.st){if(f>100)strayAhead++;}else if(f>110)farAhead++;
    if(f<1.2&&f>-16&&Math.abs(r)<(-f)*0.57+1.2){
      c.dead=true;
      if(!c.st&&c.l===3){if(st.inv<=0)hitPlayer();}
      else if(!c.st&&c.l===2){st.shake=Math.max(st.shake,0.35);st.hv+=(rnd()-0.5)*14;debris(c.x,c.y,WX,WY,LV[2],2,8,0.8);if(rnd()<0.3)sfx.thud(0.06);}
      else {brushed++;debris(c.x,c.y,WX,WY,LV[1],1,5,0.8);}
    }
    if(dx*dx+dy*dy>290*290)c.dead=true;
  }
  if(brushed&&rnd()<0.5)sfx.dust();

  // player shots
  for(const b of st.bullets){
    for(let sub=0;sub<2&&!b.dead;sub++){
      b.x+=b.vx*dt/2;b.y+=b.vy*dt/2;
      relv(b.x,b.y);const br=RR,bf=FF;
      if(bf>178){b.dead=true;break;}
      if(sub===0&&st.aliens.length){
        let tgt=null,bdist=1e9;
        for(const al of st.aliens){if(al.dead||al.f<bf+2)continue;const dr=al.r-br,df=al.f-bf;if(Math.abs(dr)>df*0.24+3)continue;const d=dr*dr+df*df;if(d<bdist){bdist=d;tgt=al;}}
        if(tgt){const [tx,ty]=rf2w(tgt.r,tgt.f);const avx=SH*st.spd+WX,avy=CH*st.spd+WY;
          let rx=b.vx-avx,ry=b.vy-avy;const sp=Math.hypot(rx,ry)||1;

          const k=Math.min(1,2.4*dt);rx=rx/sp*(1-k)+dx/dl*k;ry=ry/sp*(1-k)+dy/dl*k;const rl=Math.hypot(rx,ry)||1;
          b.vx=avx+rx/rl*sp;b.vy=avy+ry/rl*sp;}
      }
      let hit=false;
      for(const a of st.aliens){
        if(a.dead)continue;const T=TYPES[a.type];
        if(Math.abs(br-a.r)>T.w*SP/2+1.3||Math.abs(bf-a.f)>T.h*SP/2+1.3)continue;
        let bc=null,bd=1.6*1.6;
        for(const c of a.cells){if(!c.alive)continue;const cr=a.r+(c.i-(T.w-1)/2)*SP,cf=a.f-(c.j-(T.h-1)/2)*SP;const d=(cr-br)**2+(cf-bf)**2;if(d<bd){bd=d;bc=c;}}

      }
      if(hit){b.dead=true;break;}
      for(const s of st.ashots){if(s.dead)continue;if((s.r-br)**2+(s.f-bf)**2<4){s.dead=true;hit=true;st.score+=10;const [x,y]=rf2w(s.r,s.f);debris(x,y,SH*st.spd+WX,CH*st.spd+WY,[C.a,'#ffffff'],4,10,0.5);sfx.shotDown();break;}}
      if(hit){b.dead=true;break;}
      for(const p of st.pickups){if(p.dead)continue;if((p.r-br)**2+(p.f-bf)**2<9){collect(p);hit=true;break;}}
      if(hit){b.dead=true;break;}
      for(const c of st.cells){if(c.dead)continue;const ex=c.x-b.x,ey=c.y-b.y;if(ex*ex+ey*ey<2.9){explode(b.x,b.y);b.dead=true;break;}}
    }

  }
  compact(st.bullets);

  // aliens
  const es=st.hold>0?0.4:1,edt=dt*es,n=st.wave;
  let boss=false;
  for(const a of st.aliens){
    if(a.dead)continue;a.t+=edt;a.flash-=dt;
    switch(a.type){
      case 'drone':dive(a,1);break;
      case 'weaver':

        else{a.tf=Math.max(70,a.tf-2.2*edt);a.vf=clamp((a.tf-a.f)*0.9,-30,5);const tr=Math.sin(a.t*0.55+a.ph)*95;a.vr=clamp((tr-a.r)*1.4,-40,40);fireLogic(a,Math.max(2.2,4.4-0.1*n),1,edt);}

      for(const c of a.cells){if(!c.alive)continue;const [cr,cf]=cellRF(a,c);if(inTri(cr,cf,-0.4)){if(st.inv<=0){hitPlayer();}killAlien(a,true);break;}}
    }
    if(a.f<-30||Math.abs(a.r)>280)a.dead=true;
  }
  compact(st.aliens);
  if(st.pending.length){st.aliens.push(...st.pending);st.pending.length=0;}
  if(A.ctx)A.bossG.gain.setTargetAtTime(boss&&st.mode==='play'?0.14:0,A.ctx.currentTime,0.6);

  for(const s of st.ashots){
    s.r+=s.vr*edt;s.f+=s.vf*edt;
    if(inTri(s.r,s.f,-0.7)){s.dead=true;hitPlayer();continue;}
    if(s.f<-30||s.f>200||Math.abs(s.r)>200)s.dead=true;
  }
  compact(st.ashots);
  for(const p of st.pickups){

const lo=document.createElement('canvas'),lc=lo.getContext('2d');

// The tape picture is processed at VHS-like resolution (about 560 lines, sharper when the
// effect is mild so the score stays readable), then stretched back over the screen.
function vhsPost(I,roll){
  const W2=mc.width,H2=mc.height,dpr=view.dpr;
  const f=Math.min(1,(I<0.3?1000:720)/H2);
  const lw=Math.max(2,Math.round(W2*f)),lh=Math.max(2,Math.round(H2*f));
  for(const c of [lo,tmp,chn])if(c.width!==lw||c.height!==lh){c.width=lw;c.height=lh;}
  const u=view.side*dpr*f/1200;
  vhsT+=1/60;const t=vhsT;const still=reduceMotion;
  lc.globalCompositeOperation='copy';lc.imageSmoothingEnabled=true;lc.drawImage(mc,0,0,lw,lh);
  // 1. wavy lines, the tracking band, the head-switch tear at the bottom, vertical slip
  tc.globalCompositeOperation='source-over';tc.fillStyle='#000';tc.fillRect(0,0,lw,lh);
  const band=2,trackH=lh*0.08,trackY=((t*0.42)%1.25-0.12)*lh,rollPx=Math.round(roll*lh);
  for(let y=0;y<lh;y+=band){
    let dx=0;

      dx=Math.sin(y/f*0.011/dpr+t*7)*4*u*I+Math.sin(y/f*0.0021/dpr-t*1.7)*9*u*I;
      if(y>trackY&&y<trackY+trackH){const q=(y-trackY)/trackH;dx+=Math.sin(q*Math.PI)*(26+rnd()*40)*u*I;}
      if(y>lh*0.94)dx+=(14+rnd()*36)*u*I*((y-lh*0.94)/(lh*0.06)+0.4);
    }
    let dy=y+rollPx;if(dy>=lh)dy-=lh;

  }
  if(rollPx>0){tc.fillStyle='#000';tc.fillRect(0,rollPx-lh*0.035,lw,lh*0.035);}
  // 2. colour bleed: red and blue drift apart from green, plus a horizontal smear

    lc.globalCompositeOperation='source-over';lc.fillStyle='#000';lc.fillRect(0,0,lw,lh);
    lc.globalCompositeOperation='lighter';

      cc.globalCompositeOperation='copy';cc.drawImage(tmp,0,0);
      cc.globalCompositeOperation='multiply';cc.fillStyle=col;cc.fillRect(0,0,lw,lh);

  const ns=Math.round(140*I);
  for(let k=0;k<ns;k++){m.globalAlpha=rnd()*0.22;m.fillRect(rnd()*W2,rnd()*H2,1.4*dpr,1*dpr);}
  for(let k=0;k<Math.round(30*I);k++){m.globalAlpha=0.06+rnd()*0.28;m.fillRect(rnd()*W2,H2*0.94+rnd()*H2*0.06,(8+rnd()*90)*U,1*dpr);}

  if(st.paused)return;
  try{mc.setPointerCapture(e.pointerId);}catch(err){}
  ptr={id:e.pointerId,x:e.clientX};st.firing=true;
});
mc.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id)return;const dx=e.clientX-ptr.x;ptr.x=e.clientX;st.ht+=dx*(100/view.cw);});
const endPtr=e=>{if(ptr&&e.pointerId===ptr.id){ptr=null;st.firing=false;}};
mc.addEventListener('pointerup',endPtr);mc.addEventListener('pointercancel',endPtr);
mc.addEventListener('contextmenu',e=>e.preventDefault());
mc.addEventListener('touchend',()=>{audioInit();if(A.ctx&&A.ctx.state!=='running'&&!st.paused)A.ctx.resume();},{passive:true});
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='p'||k==='P'||k==='Escape'){if(st.mode==='play')setPause(!st.paused);e.preventDefault();return;}
  if(k==='m'||k==='M'){setMute(!muted);e.preventDefault();return;}
  let used=true;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=true;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.r=true;
  else if(k===' '||k==='ArrowUp'||k==='w'||k==='W'||k==='Enter')keys.f=true;
  else used=false;
  if(used){e.preventDefault();if(!e.repeat)engage();}
});
addEventListener('keyup',e=>{const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=false;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.r=false;
  else if(k===' '||k==='ArrowUp'||k==='w'||k==='W'||k==='Enter')keys.f=false;});
addEventListener('blur',()=>{keys.l=keys.r=keys.f=false;ptr=null;if(st)st.firing=false;});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(st&&st.mode==='play'&&!st.paused)setPause(true);if(A.ctx&&A.ctx.state==='running')A.ctx.suspend();}
  else if(A.ctx&&A.ctx.state!=='running'&&!(st&&st.paused))A.ctx.resume();
});
addEventListener('pagehide',()=>{if(A.ctx&&A.ctx.state==='running')A.ctx.suspend();});

// Fit the part of the display that carries content (x 200-1060, y 215-1175), not the whole square,
// so on a phone the instrument runs edge to edge and the empty corners fall off-screen.
function fit(){
  const dpr=Math.min(2,window.devicePixelRatio||1);const vw=innerWidth,vh=innerHeight;
  mc.width=Math.round(vw*dpr);mc.height=Math.round(vh*dpr);
  const cs=getComputedStyle(probe);
  const it=parseFloat(cs.paddingTop)||0,ib=parseFloat(cs.paddingBottom)||0,il=parseFloat(cs.paddingLeft)||0,ir=parseFloat(cs.paddingRight)||0;
  const aw=vw-il-ir-10,ah=vh-it-ib-10;
  const k=Math.max(0.2,Math.min(aw/860,ah/960));
  const portrait=vh>vw*1.25;
  const cxs=il+(vw-il-ir)/2,cys=it+(vh-it-ib)*(portrait?0.43:0.5);
  view.il=il;view.it=it;view.ib=ib;
  view.side=1200*k;view.cw=860*k;view.x=cxs-630*k;view.y=cys-695*k;view.dpr=dpr;
  TS=k<0.62?0.8:1;
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,150));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* ---------- boot ---------- */
let last=0;
function loop(now){
  const dt=last?Math.min(0.05,(now-last)/1000):0.016;last=now;
  if(!st.paused)update(dt);
  draw();present();requestAnimationFrame(loop);
}
function start(data){
  if(data&&data.st&&data.st.ver===2&&Array.isArray(data.st.cells)){st=data.st;st.firing=false;if(st.mode==='play')st.paused=true;}
  else{st=newState();initWorld();}
  fit();
  if(document.fonts&&document.fonts.load)document.fonts.load(`40px "B612 Mono"`).catch(()=>{});
  requestAnimationFrame(loop);
}
try{window.claude?.hot?.snapshot?.(()=>({st}));}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
})();
</script>
